<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ES KULKUL PRO</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Recharts -->
  <script src="https://unpkg.com/recharts/umd/Recharts.min.js"></script>

  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      deleteDoc,
      doc,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    import {
      getAuth,
      signInAnonymously,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    window.firebaseModules = {
      initializeApp,
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      deleteDoc,
      doc,
      updateDoc,
      getAuth,
      signInAnonymously,
      onAuthStateChanged
    };
  </script>
</head>

<body class="bg-slate-50">
  <div id="root"></div>

  <script type="text/babel">

    const {
      useState,
      useEffect,
      useMemo
    } = React;

    const {
      AreaChart,
      Area,
      XAxis,
      YAxis,
      CartesianGrid,
      Tooltip,
      ResponsiveContainer
    } = Recharts;

    const {
      initializeApp,
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      deleteDoc,
      doc,
      updateDoc,
      getAuth,
      signInAnonymously,
      onAuthStateChanged
    } = window.firebaseModules;

    // FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "ISI_API_KEY",
      authDomain: "ISI_AUTH_DOMAIN",
      projectId: "ISI_PROJECT_ID",
      storageBucket: "ISI_STORAGE_BUCKET",
      messagingSenderId: "ISI_SENDER_ID",
      appId: "ISI_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const PRODUCT_VARIANTS = [
      "Pisang",
      "Melon",
      "Stroberi",
      "Mangga",
      "Anggur"
    ];

    function App() {

      const [user, setUser] = useState(null);
      const [penjualan, setPenjualan] = useState([]);
      const [formData, setFormData] = useState({});
      const [isModalOpen, setIsModalOpen] = useState(false);

      useEffect(() => {

        signInAnonymously(auth);

        const unsubAuth = onAuthStateChanged(auth, (u) => {
          setUser(u);
        });

        const q = query(collection(db, "penjualan"));

        const unsubData = onSnapshot(q, (snapshot) => {
          const data = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));

          setPenjualan(data);
        });

        return () => {
          unsubAuth();
          unsubData();
        };

      }, []);

      const totalOmzet = useMemo(() => {
        return penjualan.reduce((a, b) => a + (b.total || 0), 0);
      }, [penjualan]);

      const handleSave = async (e) => {
        e.preventDefault();

        await addDoc(collection(db, "penjualan"), {
          ...formData,
          createdAt: new Date().toISOString()
        });

        setFormData({});
        setIsModalOpen(false);
      };

      const handleDelete = async (id) => {
        await deleteDoc(doc(db, "penjualan", id));
      };

      const formatIDR = (val) => {
        return new Intl.NumberFormat("id-ID", {
          style: "currency",
          currency: "IDR",
          maximumFractionDigits: 0
        }).format(val || 0);
      };

      return (
        <div className="min-h-screen p-8">

          <div className="flex justify-between items-center mb-8">
            <div>
              <h1 className="text-4xl font-black text-indigo-600">
                ES KULKUL PRO
              </h1>
              <p className="text-slate-500">
                Dashboard Bisnis Modern
              </p>
            </div>

            <button
              onClick={() => setIsModalOpen(true)}
              className="bg-indigo-600 text-white px-6 py-3 rounded-2xl font-bold"
            >
              Tambah Data
            </button>
          </div>

          {/* CARD */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">

            <div className="bg-white rounded-3xl p-6 shadow">
              <p className="text-slate-400 text-sm">
                Total Omzet
              </p>

              <h2 className="text-3xl font-black mt-2 text-indigo-600">
                {formatIDR(totalOmzet)}
              </h2>
            </div>

          </div>

          {/* CHART */}
          <div className="bg-white rounded-3xl p-6 shadow mb-8">

            <h3 className="font-bold mb-4">
              Tren Penjualan
            </h3>

            <div className="h-[300px]">

              <ResponsiveContainer width="100%" height="100%">

                <AreaChart data={penjualan}>

                  <CartesianGrid strokeDasharray="3 3" />

                  <XAxis dataKey="tanggal" />

                  <YAxis />

                  <Tooltip />

                  <Area
                    type="monotone"
                    dataKey="total"
                    stroke="#4f46e5"
                    fill="#4f46e533"
                  />

                </AreaChart>

              </ResponsiveContainer>

            </div>
          </div>

          {/* TABLE */}
          <div className="bg-white rounded-3xl overflow-hidden shadow">

            <table className="w-full">

              <thead className="bg-slate-100">
                <tr>
                  <th className="p-4 text-left">Produk</th>
                  <th className="p-4 text-left">Tanggal</th>
                  <th className="p-4 text-left">Total</th>
                  <th className="p-4 text-left">Aksi</th>
                </tr>
              </thead>

              <tbody>

                {penjualan.map((item) => (

                  <tr key={item.id} className="border-t">

                    <td className="p-4">
                      {item.produk}
                    </td>

                    <td className="p-4">
                      {item.tanggal}
                    </td>

                    <td className="p-4 font-bold text-indigo-600">
                      {formatIDR(item.total)}
                    </td>

                    <td className="p-4">

                      <button
                        onClick={() => handleDelete(item.id)}
                        className="bg-red-500 text-white px-4 py-2 rounded-xl"
                      >
                        Hapus
                      </button>

                    </td>

                  </tr>

                ))}

              </tbody>

            </table>

          </div>

          {/* MODAL */}
          {isModalOpen && (

            <div className="fixed inset-0 bg-black/50 flex items-center justify-center">

              <div className="bg-white p-8 rounded-3xl w-full max-w-md">

                <h3 className="text-2xl font-black mb-6">
                  Tambah Penjualan
                </h3>

                <form onSubmit={handleSave} className="space-y-4">

                  <select
                    className="w-full border rounded-2xl p-4"
                    value={formData.produk || ""}
                    onChange={(e) =>
                      setFormData({
                        ...formData,
                        produk: e.target.value
                      })
                    }
                  >
                    <option value="">Pilih Produk</option>

                    {PRODUCT_VARIANTS.map(v => (
                      <option key={v} value={v}>
                        {v}
                      </option>
                    ))}

                  </select>

                  <input
                    type="date"
                    className="w-full border rounded-2xl p-4"
                    onChange={(e) =>
                      setFormData({
                        ...formData,
                        tanggal: e.target.value
                      })
                    }
                  />

                  <input
                    type="number"
                    placeholder="Total"
                    className="w-full border rounded-2xl p-4"
                    onChange={(e) =>
                      setFormData({
                        ...formData,
                        total: Number(e.target.value)
                      })
                    }
                  />

                  <button
                    type="submit"
                    className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold"
                  >
                    Simpan
                  </button>

                </form>

              </div>

            </div>

          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);

  </script>
</body>
</html>
